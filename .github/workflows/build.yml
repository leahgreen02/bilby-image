name: build-sif

on: workflow_dispatch

jobs:
  sif:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Refresh package lists and install FUSE dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-3
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Build SIF from GHCR image
        run: |
          sudo apptainer build bilby-eos-v2.sif docker://ghcr.io/leahgreen02/bilby-eos-v2:0.2
          sudo chown "$USER" bilby-eos-v2.sif
          ls -lh bilby-eos-v2.sif
      - name: Check bilby version inside the SIF
        run: |
          VERSION=$(apptainer exec bilby-eos-v2.sif python -c "import bilby; print(bilby.__version__)")
          echo "bilby version: $VERSION"
          if [ "$VERSION" != "0.1.0.dev5476+g9656d84e7" ]; then
            echo "Wrong bilby version, refusing to publish"
            exit 1
          fi
      - name: Check ConfigArgParse version inside the SIF
        run: |
          CAP=$(apptainer exec bilby-eos-v2.sif /opt/conda/envs/bilby/bin/python -c "import importlib.metadata as m; print(m.version('ConfigArgParse'))")
          echo "ConfigArgParse: $CAP"
          if [ "$CAP" != "1.7.1" ]; then
            echo "Wrong ConfigArgParse version, refusing to publish"
            exit 1
          fi    
      - name: Check size is under the release asset limit
        run: |
          SIZE=$(stat -c %s bilby-eos-v2.sif)
          echo "SIF size: $SIZE bytes"
          if [ "$SIZE" -gt 2147483648 ]; then
            echo "Over 2 GB, GitHub release assets cannot hold it"
            exit 1
          fi
      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sif-0.2 bilby-eos-v2.sif \
            --repo "${{ github.repository }}" \
            --title "bilby-eos-v2 SIF 0.2" \
            --notes "bilby 0.1.0.dev5476+g9656d84e7 (commit 9656d84e7), built from ghcr.io/leahgreen02/bilby-eos-v2:0.2"
